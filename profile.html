<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LONEWOLF - Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">LONEWOLF</div>
            <div class="beta-tag">BETA</div>
        </header>

        <main class="content">
            <div class="profile-header">
                <div class="profile-avatar">👤</div>
                <h2>Alex Wilson</h2>
                <p style="color: var(--text-muted); margin-top: 8px;">alexwil@gmail.com</p>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number">12</div>
                    <div style="color: var(--text-muted); margin-top: 4px;">Joined</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">3</div>
                    <div style="color: var(--text-muted); margin-top: 4px;">Hosted</div>
                </div>
            </div>

            <div class="event-card" style="text-align: center; cursor: pointer;">
                <h3>My Calendar</h3>
            </div>
            <div class="event-card" style="text-align: center; cursor: pointer;">
                <h3>Settings</h3>
            </div>
            <div class="event-card" style="text-align: center; cursor: pointer; border-color: #ef4444; color: #ef4444;">
                <h3 style="color: #ef4444;">Logout</h3>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="#" class="nav-item">Map</a>
            <a href="index.html" class="nav-item">Events</a>
            <a href="#" class="nav-item">Notifications</a>
            <a href="profile.html" class="nav-item active">Profile</a>
        </nav>
    </div>
</body>
</html>
